# ==============================================================================
# OmniDev — Infrastructure for the modular monolith
# PostgreSQL + pgvector, Redis, MinIO, Tika and one-shot database migrations.
# Usage: docker compose -f deploy/docker/docker-compose.infra.yml up -d
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnidev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: omnidev
      POSTGRES_PASSWORD: omnidev
      POSTGRES_DB: omnidev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnidev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnidev

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: omnidev-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps/gateway/migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://omnidev:omnidev@postgres:5432/omnidev?sslmode=disable
      - up
    networks:
      - omnidev

  redis:
    image: redis:7-alpine
    container_name: omnidev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass 123456
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnidev

  minio:
    image: minio/minio:latest
    container_name: omnidev-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnidev

  tika:
    image: apache/tika:latest
    container_name: omnidev-tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9998/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - omnidev

networks:
  omnidev:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

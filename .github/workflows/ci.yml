# =============================================================================
# OmniDev CI — modular monolith (gateway + go-common + web)
# The gateway imports the sibling knowledge-engine module, so both repositories
# are checked out side by side.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"

jobs:
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: omnidev
      - uses: actions/checkout@v4
        with:
          repository: m2lan/knowledge-engine
          path: knowledge-engine

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: omnidev
          args: --timeout=5m ./apps/gateway/... ./packages/go-common/...

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: go-lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omnidev
          POSTGRES_PASSWORD: omnidev
          POSTGRES_DB: omnidev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnidev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: omnidev
      - uses: actions/checkout@v4
        with:
          repository: m2lan/knowledge-engine
          path: knowledge-engine

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run database migrations
        run: >-
          docker run --rm --network host
          -v "$PWD/omnidev/apps/gateway/migrations:/migrations"
          migrate/migrate:v4.17.1
          -path /migrations
          -database "postgres://omnidev:omnidev@localhost:5432/omnidev_test?sslmode=disable"
          up

      - name: Run tests
        working-directory: omnidev
        run: go test ./apps/gateway/... ./packages/go-common/... -race -count=1 -coverprofile=coverage.out -covermode=atomic
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: omnidev
          DB_PASSWORD: omnidev
          DB_NAME: omnidev_test
          DB_SSLMODE: disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: omnidev/coverage.out

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omnidev
    steps:
      - uses: actions/checkout@v4
        with:
          path: omnidev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: omnidev/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter web typecheck

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: omnidev
    steps:
      - uses: actions/checkout@v4
        with:
          path: omnidev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: omnidev/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  docker-build:
    name: Gateway Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          path: omnidev
      - uses: actions/checkout@v4
        with:
          repository: m2lan/knowledge-engine
          path: knowledge-engine

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: omnidev/apps/gateway/Dockerfile
          push: false
          tags: omnidev/gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
